<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#bgGrad)" stroke-width="6" opacity="0.9" />
  <circle cx="200" cy="200" r="175" fill="url(#avatarGrad)" />

  <!-- Background Decorative Grid Dots -->
  <g opacity="0.15" fill="#38bdf8">
    <circle cx="90" cy="90" r="4"/>
    <circle cx="120" cy="90" r="4"/>
    <circle cx="150" cy="90" r="4"/>
    <circle cx="250" cy="90" r="4"/>
    <circle cx="280" cy="90" r="4"/>
    <circle cx="310" cy="90" r="4"/>
    <circle cx="90" cy="120" r="4"/>
    <circle cx="310" cy="120" r="4"/>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Body -->
  <path d="M 100 370 C 100 290 140 260 200 260 C 260 260 300 290 300 370 Z" fill="url(#shirtGrad)" />
  <!-- Collar / Tie detail -->
  <path d="M 180 260 L 200 295 L 220 260 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 195 275 L 200 350 L 205 350 L 205 275 Z" fill="#0f172a" opacity="0.5" />

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="60" rx="8" fill="#fcd34d" />

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="55" ry="65" fill="#fcd34d" />

  <!-- Modern Hair Style -->
  <path d="M 145 170 C 145 110 170 95 200 95 C 235 95 255 110 255 155 C 255 175 250 175 240 150 C 225 125 175 120 155 160 C 148 175 145 175 145 170 Z" fill="#1e1b4b" />

  <!-- Spectacles / Tech Glasses -->
  <rect x="160" y="160" width="32" height="24" rx="6" fill="none" stroke="#0ea5e9" stroke-width="3.5" />
  <rect x="208" y="160" width="32" height="24" rx="6" fill="none" stroke="#0ea5e9" stroke-width="3.5" />
  <line x1="192" y1="172" x2="208" y2="172" stroke="#0ea5e9" stroke-width="3.5" />

  <!-- Friendly Smile -->
  <path d="M 185 205 Q 200 220 215 205" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

  <!-- Tech Badges Floating -->
  <g transform="translate(45, 170)">
    <rect width="64" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <text x="32" y="18" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">QA</text>
  </g>
  <g transform="translate(290, 170)">
    <rect width="70" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="35" y="18" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&lt;CODE/&gt;</text>
  </g>
  <g transform="translate(145, 330)">
    <rect width="110" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="55" y="21" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MCA · 2026</text>
  </g>
</svg>
